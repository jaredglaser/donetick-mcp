name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request from a branch in this repo would otherwise run twice, once per
# trigger, and the two runs land in different groups because github.ref is the
# branch on push and refs/pull/N/merge on pull_request. Restricting push to main
# is what actually dedupes them; the group only collapses successive runs of the
# same kind.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo. The default for a public repo can be
# read/write depending on org settings, so it is stated rather than inherited.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # verify:live waits on a container healthcheck with 45 retries. Without a
    # ceiling a container that never becomes healthy burns the 6 hour default.
    timeout-minutes: 15
    steps:
      # Pinned by commit, not by tag: a tag is mutable, so `@v5` lets whoever controls
      # the action change what runs here without a commit in this repo.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test --isolate

      # Starts the pinned Donetick from compose.verify.yaml, signs a throwaway
      # user up, mints its token, and checks the wire contract against it. No
      # secret is configured for this job on purpose: the script reads no
      # credentials from the environment and can only reach the container it
      # started itself.
      - run: bun run verify:live

      - name: Donetick container logs
        if: failure()
        run: docker compose --file compose.verify.yaml logs --no-color

      # verify:live leaves the container up so a local run can reuse it. The
      # runner is discarded either way, so this is for a self-hosted runner and
      # for making the leftover visible rather than incidental.
      - name: Tear the container down
        if: always()
        # Cleanup must never be the thing that fails the run, including on the
        # path where setup-bun died and there is no bun to run this with.
        continue-on-error: true
        run: bun run verify:down
